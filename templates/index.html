<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Speech Emotion Recognition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #74ebd5, #acb6e5);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background-color: turquoise;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-weight: 600;
            color: #333;
        }

        form {
            margin-bottom: 20px;
        }

        input[type="file"] {
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        button {
            background-color: #4e54c8;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: Navy;
        }

        .result {
            font-size: 20px;
            color: #4e54c8;
            font-weight: 600;
        }

        audio {
            margin-top: 15px;
            width: 100%;
            outline: none;
        }

        .container {
    background-color: turquoise;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    width: 90%;
    max-width: 500px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 500px;
}

.footer-link {
    margin-top: auto;
    padding-top: 20px;
    text-align: center;
}

.footer-link a {
    text-decoration: none;
    font-weight: 500;
    color: #333;
    background-color: Turquoise;
    padding: 10px 15px;
    border-radius: 10px;
    transition: all 0.3s ease;
}

.footer-link a:hover {
    background-color: Navy;
    color: White;
}


    </style>
</head>
<body>
    <div class="container">
        <h1>Speech Emotion Recognition</h1>
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="audio" accept=".wav" required>
            <button type="submit">Recognise Emotion</button>
        </form>


        {% if prediction %}
            <div class="result">Recognised Emotion: {{ prediction }}</div>
        {% endif %}

        {% if filename %}
            <audio controls>
                <source src="{{ url_for('uploaded_file', filename=filename) }}" type="audio/wav">
                Your browser does not support the audio element.
            </audio>
        {% endif %}

        <div class="footer-link">
            <a href="{{ url_for('about') }}">About This Project</a>
        </div>
    </div>


</body>
</html>
